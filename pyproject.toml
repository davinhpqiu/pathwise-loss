[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathloss"
version = "0.1.0"
description = "Loss functions for path-to-path learning"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["pathloss*", "response_distance", "response_distance.code", "response_distance.scripts"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests", "response_distance/tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests", "response_distance"]

[tool.ruff.lint.isort]
known-first-party = ["pathloss", "response_distance"]
