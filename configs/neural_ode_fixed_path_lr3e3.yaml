name: neural_ode_fixed_path_lr3e3

data:
  n_target: 64
  n_fine: 513
  conditions: [uniform]

model:
  n_fourier: 5
  max_step: 0.001953125       # 1 / 512, fixed-step RK4

capacities:
  restricted:
    hidden: 2
    width: 16
  expressive:
    hidden: 8
    width: 64

signature:
  output_scale: 1.0
  audit_accepted: true
  global_depth: 4
  local_depth: 2
  local_intervals: 10

train:
  seeds: [0]
  updates: 10000
  evaluation_checkpoints: [0, 100, 500, 1000, 2500, 5000, 7500, 10000]
  lr: 0.003
  device: cpu

study:
  cases:
    - {condition: uniform, loss: mse}
    - {condition: uniform, loss: j2}
    - {condition: uniform, loss: sig_global}
    - {condition: uniform, loss: sig_local}
  reuse_roots: []

evaluation:
  n_points: 1025
  solver_max_steps: [0.001953125, 0.0009765625, 0.00048828125]

