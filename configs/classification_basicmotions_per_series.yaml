name: classification_basicmotions_per_series

data:
  train: data/raw/BasicMotions/BasicMotions_TRAIN.ts
  test: data/raw/BasicMotions/BasicMotions_TEST.ts
  normalisation: per_series

classifier:
  neighbours: 1
  n_jobs: 1
  distances:
    - name: euclidean
    - name: dtw_dependent
    - name: dtw_independent

output: results/runs/classification_basicmotions_per_series
