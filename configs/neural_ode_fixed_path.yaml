name: neural_ode_fixed_path

data:
  n_target: 64
  n_fine: 513
  conditions: [uniform, clustered]

model:
  n_fourier: 5
  max_step: 0.001953125       # 1 / 512, fixed-step RK4

capacities:
  restricted:
    hidden: 2
    width: 16
  expressive:
    hidden: 8
    width: 64

losses:
  primary: [mse, j2]
  smooth_secondary: [h1]
  signature_secondary: [sig_global, sig_local]

signature:
  # Constructed target is dimensionless and all channels are order one.
  # Freeze after levelwise value and gradient audit, before comparative fits.
  output_scale: 1.0
  audit_accepted: false
  global_depth: 4
  local_depth: 2
  local_intervals: 10
  audit:
    seed: 991
    capacity: expressive

train:
  seeds: [0, 1, 2, 3, 4]
  updates: 5000
  lr: 0.001
  device: cpu

# Run before comparative fits. Failure stops the comparison until model or
# optimization, rather than an acceptance threshold, is repaired.
adequacy:
  seed: 991
  capacity: expressive
  updates: 5000
  max_dense_mse: 0.001
