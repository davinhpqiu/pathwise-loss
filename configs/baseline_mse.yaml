# Baseline: pointwise MSE on a path-to-path model. Everything else is measured
# against this. One YAML per experiment.
#
#     python scripts/run_experiment.py --config configs/baseline_mse.yaml \
#            --out results/runs/baseline_mse

name: baseline_mse
seed: 0

data:
  generator: ornstein_uhlenbeck   # {ornstein_uhlenbeck, brownian_motion, smooth_test_path}
  n_train: 512
  n_val: 128
  n_fine: 513                     # ground-truth "continuous" grid
  n_ctx: 64                       # points the model sees
  n_tgt: 64                       # points the loss is evaluated on
  d: 1
  noise: 0.0                      # observation noise on context only
  missing_rate: 0.0               # hidden context channels, accompanied by mask
  sampling:
    # Target times are irregular by design: on an even grid the weighted L^2
    # loss equals MSE up to O(1/n_tgt), so no loss comparison could show
    # anything. See notebook 01 section 3 and logbook 2026-08-13.
    mode: clustered               # {uniform, clustered}
    density_bias: 3.0             # 0 recovers uniform

model:
  kind: gru_query                 # GRU encoder + MLP decoder at query times
  hidden: 64
  layers: 2
  width: 128
  n_fourier: 8                    # Fourier features on the query time; 0 = raw scalar

loss:
  kind: mse                       # {mse, integral_l1, integral_l2, integral_l4, integral_linf}

train:
  epochs: 200
  batch_size: 64
  lr: 1.0e-3
  device: cpu

evaluation:
  missingness_rates: [0.0, 0.1, 0.3, 0.5]

# Every metric is reported every run, whatever was trained against: a loss value
# is uninterpretable without the others beside it (logbook 2026-08-06).
